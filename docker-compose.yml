services:
  mysql:
    image: mysql:8.0
    container_name: vben_admin_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: "123456"   # 生产环境请修改
      TZ: Asia/Shanghai
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_general_ci
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      # 首次启动自动执行建表脚本
      - ./manifest/sql/create.sql:/docker-entrypoint-initdb.d/create.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-p123456"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: vben_admin_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: vben_admin_backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8000:8000"
    volumes:
      # 如需自定义配置, 放开下面一行并准备好宿主机配置文件
      # - ./manifest/config/config.yaml:/app/manifest/config/config.yaml:ro
      - backend_logs:/app/logs

volumes:
  mysql_data:
  redis_data:
  backend_logs:
